---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  deps:
    desc: Install or verify enstow
    cmds:
      - 'command -v enstow >/dev/null 2>&1 && enstow --version ||
        (command -v brew >/dev/null 2>&1 && brew install nicholaswilde/homebrew-tap/enstow) ||
        { echo "Install enstow from https://github.com/nicholaswilde/enstow" >&2; false; }'

  apply:
    aliases: [stow, install]
    desc: Apply agy package with enstow
    cmds:
      - 'enstow apply {{ .CLI_ARGS }}'

  test:
    desc: Preview enstow apply (dry-run)
    cmds:
      - 'enstow apply --dry-run {{ .CLI_ARGS }}'

  restow:
    desc: Restow agy package with enstow
    cmds:
      - 'enstow restow {{ .CLI_ARGS }}'

  restow:test:
    desc: Preview enstow restow (dry-run)
    cmds:
      - 'enstow restow --dry-run {{ .CLI_ARGS }}'

  unstow:
    aliases: [del, delete]
    desc: Remove managed symlinks with enstow
    cmds:
      - 'enstow unstow {{ .CLI_ARGS }}'

  unstow:test:
    aliases: [del:test]
    desc: Preview enstow unstow (dry-run)
    cmds:
      - 'enstow unstow --dry-run {{ .CLI_ARGS }}'

  scrub:
    desc: Securely shred decrypted secrets and remove managed symlinks
    cmds:
      - 'enstow scrub {{ .CLI_ARGS }}'

  status:
    desc: Show sync status of managed dotfiles
    cmds:
      - 'enstow status {{ .CLI_ARGS }}'

  diff:
    desc: Show diff between dotfiles and targets (secrets masked)
    cmds:
      - 'enstow diff {{ .CLI_ARGS }}'

  doctor:
    desc: Audit symlink health, secret permissions, and leaks
    cmds:
      - 'enstow doctor {{ .CLI_ARGS }}'

  check-secrets:
    desc: Verify staged files for plaintext secrets and credential leaks
    cmds:
      - 'enstow doctor --staged -s .'

  install-hooks:
    desc: Install git pre-commit hook using enstow doctor --staged
    cmds:
      - mkdir -p .git/hooks
      - |
        rm -f .git/hooks/pre-commit
        cat <<'EOF' > .git/hooks/pre-commit
        #!/usr/bin/env sh
        exec enstow doctor --staged -s .
        EOF
        chmod +x .git/hooks/pre-commit

  plugins:
    desc: Install plugins
    cmds:
      - agy plugin install https://github.com/DietrichGebert/ponytail
      - agy plugin install https://github.com/JuliusBrussee/caveman
      - npm install -g context-mode
      - npm install -g ctx7
      - agy plugin install https://github.com/mksglu/context-mode/tree/main/configs/antigravity-cli

  lint:md:
    desc: Lint Markdown files
    cmds:
      - rumdl check .

  fmt:md:
    desc: Format Markdown files
    cmds:
      - rumdl fmt .

  lint:yaml:
    desc: Lint YAML files
    cmds:
      - yamllint-rs .

  lint:tokens:
    desc: Lint rules and skill frontmatters for token compression and size caps
    cmds:
      - python3 ./scripts/lint-tokens.py

  lint:
    desc: Lint all files
    cmds:
      - task: lint:md
      - task: lint:yaml
      - task: lint:tokens

  notify:check:
    desc: 'Run uncommitted changes check manually'
    cmds:
      - './scripts/notify-dirty.sh {{.CLI_ARGS}}'

  notify:install:
    desc: 'Install and activate systemd user timer'
    cmds:
      - 'mkdir -p ~/.config/systemd/user'
      - 'ln -sf "$(pwd)/systemd/agy-dirty-notify.service" ~/.config/systemd/user/agy-dirty-notify.service'
      - 'ln -sf "$(pwd)/systemd/agy-dirty-notify.timer" ~/.config/systemd/user/agy-dirty-notify.timer'
      - 'systemctl --user daemon-reload'
      - 'systemctl --user "enable" --now agy-dirty-notify.timer'

  notify:status:
    desc: 'Check status of systemd timer and service'
    cmds:
      - 'systemctl --user status agy-dirty-notify.timer --no-pager'
      - 'systemctl --user list-timers agy-dirty-notify.timer'

  notify:uninstall:
    desc: 'Stop and remove systemd user timer'
    cmds:
      - 'systemctl --user "disable" --now agy-dirty-notify.timer || :'
      - 'rm -f ~/.config/systemd/user/agy-dirty-notify.service ~/.config/systemd/user/agy-dirty-notify.timer'
      - 'systemctl --user daemon-reload'

  batch:list:
    desc: List catalog actions or matching repos
    cmds:
      - 'uv run scripts/batch.py list {{ .CLI_ARGS }}'

  batch:sync:
    desc: Scan ~/git/nicholaswilde and diff/update repos.toml
    cmds:
      - 'uv run scripts/batch.py sync {{ .CLI_ARGS }}'

  batch:zensical:
    desc: Update zensical across cataloged repos
    cmds:
      - 'uv run scripts/batch.py zensical-update {{ .CLI_ARGS }}'

  batch:sync-agents:
    desc: Sync AGENTS.md, .agents/rules, skills catalog, and .gitignore across repos
    cmds:
      - 'uv run scripts/batch.py sync-agents {{ .CLI_ARGS }}'

  batch:run-skill:
    desc: Run an Antigravity skill via agy -p across cataloged repos
    cmds:
      - 'uv run scripts/batch.py run-skill {{ .CLI_ARGS }}'

  batch:test:
    desc: Run batch runner unit tests
    cmds:
      - 'uv run python3 -m unittest -v scripts/test_batch.py'

  default:
    cmds:
      - task -l
    silent: true
