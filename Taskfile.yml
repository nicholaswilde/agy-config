---
# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  STOW_ARGS: '-v -t ~/ agy'

tasks:
  restow:
    desc: Restow
    cmds:
      - stow -R {{ .STOW_ARGS }}

  restow:test:
    desc: Restow test
    cmds:
      - stow -n -R {{ .STOW_ARGS }}

  stow:
    desc: Stow
    cmds:
      - stow -S {{ .STOW_ARGS }}

  test:
    desc: Test
    cmds:
      - stow -n -S {{ .STOW_ARGS }}

  del:
    desc: Delete
    cmds:
      - stow -D {{ .STOW_ARGS }}

  del:test:
    desc: Delete test
    cmds:
      - stow -n -D {{ .STOW_ARGS }}

  plugins:
    desc: Install plugins
    cmds:
      - agy plugin install https://github.com/DietrichGebert/ponytail
      - agy plugin install https://github.com/JuliusBrussee/caveman
      - npm install -g context-mode
      - agy plugin install https://github.com/mksglu/context-mode/tree/main/configs/antigravity-cli

  lint:md:
    desc: Lint Markdown files
    cmds:
      - rumdl check .

  fmt:md:
    desc: Format Markdown files
    cmds:
      - rumdl fmt .

  lint:yaml:
    desc: Lint YAML files
    cmds:
      - yamllint-rs .

  lint:
    desc: Lint all files
    cmds:
      - task: lint:md
      - task: lint:yaml

  notify:check:
    desc: 'Run uncommitted changes check manually'
    cmds:
      - './scripts/notify-dirty.sh {{.CLI_ARGS}}'

  notify:install:
    desc: 'Install and activate systemd user timer'
    cmds:
      - 'mkdir -p ~/.config/systemd/user'
      - 'ln -sf "$(pwd)/systemd/agy-dirty-notify.service" ~/.config/systemd/user/agy-dirty-notify.service'
      - 'ln -sf "$(pwd)/systemd/agy-dirty-notify.timer" ~/.config/systemd/user/agy-dirty-notify.timer'
      - 'systemctl --user daemon-reload'
      - 'systemctl --user "enable" --now agy-dirty-notify.timer'

  notify:status:
    desc: 'Check status of systemd timer and service'
    cmds:
      - 'systemctl --user status agy-dirty-notify.timer --no-pager'
      - 'systemctl --user list-timers agy-dirty-notify.timer'

  notify:uninstall:
    desc: 'Stop and remove systemd user timer'
    cmds:
      - 'systemctl --user "disable" --now agy-dirty-notify.timer || :'
      - 'rm -f ~/.config/systemd/user/agy-dirty-notify.service ~/.config/systemd/user/agy-dirty-notify.timer'
      - 'systemctl --user daemon-reload'


  default:
    cmds:
      - task -l
    silent: true
